name: kirana_store
description: "A production-grade, mobile-first Flutter app for Indian Kirana store management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.5.1
  decimal: ^3.0.2
  drift: ^2.18.0
  sqlite3: ^2.4.4
  path_provider: ^2.1.2
  path: ^1.9.0
  uuid: ^4.3.3
  mobile_scanner: ^5.1.1
  barcode_widget: ^2.0.4
  barcode: ^2.2.8
  share_plus: ^9.0.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
